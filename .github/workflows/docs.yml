name: Docs

# 仕様書のサイト(docs-site/)を作り、main に入ったら GitHub Pages で公開する。
# PR では、警告なしに作れることだけを確かめ、公開しない
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'frontend/public/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'frontend/public/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# 公開が重なったときは、先に始めたものを最後まで走らせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 手元(docs-site/compose.yaml)と同じイメージで作る。リポジトリは読み取り専用で渡す
      - name: Build site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          docker run --rm \
            -e SITE_URL="$SITE_URL" \
            -v "$PWD:/work:ro" \
            -v "$RUNNER_TEMP/site:/site" \
            -w /work/docs-site \
            squidfunk/mkdocs-material:9 build --strict -d /site

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
